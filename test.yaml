# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#    map_shuffle:
#      on: 5
#      off: 15
#
#    Means you have 5 chances for map shuffle to occur, and 15 chances for map shuffle to be turned
#    off.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: Test

# Used to describe your yaml. Useful if you have multiple files.
description: Default Derail Valley Template

game: Derail Valley
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Derail Valley: 0.2.1 # Version of the world required for this yaml to work as expected.

Derail Valley:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    # 
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-99: 0 # random value between 0 and 99
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    # 
    # **Full:** ensure everything can be reached and acquired.
    # 
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  dispatcher:
    # Choose what to do with dispatcher license:
    # From start: you get it by the start of the game
    # Non randomized: it will not be randomized and can be bought with $10.000
    # Randomized: it can be anywhere (WARNING: it can be put anywhere in the multiworld)
    from_start: 0
    non_randomized: 50
    randomized: 0

  start_loco:
    # Choose which train license you want to start:
    # - One of the 6 locomotives: straightforward
    # - Starting random: start at random with one of DE2, DM3 or S060
    # - Full random: No restriction (WARNING your first loco license can be anywhere)
    de2: 0
    dm3: 0
    dh4: 0
    s060: 0
    s282: 0
    de6: 0
    starting_random: 50
    full_random: 0

  station_licenses:
    # By logic, you are required to acquire a station license to perform
    # activities in its proximity (Discover restoration loco points, starting jobs, buying
    # in shops when applicable). 
    #  - No licenses: Makes it so that station licenses are not needed (gives you them all)
    #  - Start with one: Start with at least one at random so you can play the game (except MB)
    #  - All random: No restriction (WARNING: your first station license can be anywhere)
    all_random: 0
    start_with_one: 50
    no_licenses: 0

  money:
    # How much money you start with
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 10000
    2000: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-10000: 0 # random value between 0 and 10000

  nb_jobs:
    # To win the randomizer, you will need to perform at least N shunting or
    # transport jobs from M stations. Here you choose N.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 1000
    7: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-1000: 0 # random value between 1 and 1000

  nb_stations:
    # To win the randomizer, you will need to perform at least N shunting or
    # transport jobs from M stations. Here you choose M.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 20
    7: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-20: 0 # random value between 1 and 20

  nb_freights:
    # How many transport jobs give unique items
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 256
    3: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-256: 0 # random value between 1 and 256

  nb_shunts:
    # How many shuntings give unique items
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 256
    7: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-256: 0 # random value between 1 and 256

  nb_locos:
    # One of the locations is to perform a given number
    # of jobs using each locomotive (6 checks).
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 20
    5: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-20: 0 # random value between 0 and 20

  start_job:
    # Choose your starting job license
    # - One of the three: straightforward
    # - One random: choose one at random
    # - No restriction: WARNING your first job license may be anywhere
    transport: 0
    shunting: 0
    logistical_haul: 0
    one_random: 50
    no_restriction: 0

  hints_loco:
    # Add the item locked behind number of jobs with a loco on the corresponding license
    'false': 50
    'true': 0

  hints_station:
    # Add the items locked behing doing jobs in a given station on the corresponding license
    'false': 50
    'true': 0

  death_link:
    # When you die, everyone who enabled death link dies. Of course, the reverse is true too.
    'false': 50
    'true': 0

  double_tokens:
    # How many free locations will be double jobs tokens (When you get one, next job you finish will count for two)
    # 0 = No double job tokens/100 = After putting all necessary items (licenses, demo locos, paintsprayer, etc...) all remaining items will be double job tokens
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 100
    10: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-100: 0 # random value between 0 and 100

  hints_first:
    # Gives you hints about the first in-logic job license, loco license and station license if you have respectively chosen the "Fully randomized" option.
    # For example, if you chose to start with the DE2 license, fully randomized station licenses and one random job license, you will have the hint of the earliest
    # in-logic station license you can have.
    'false': 50
    'true': 0

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: "Bomb: 1"
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
